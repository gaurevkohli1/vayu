name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/vayu-athleisure-site-qrjjzm]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vendor campaign assets from generation CDN
        run: node scripts/fetch-assets.mjs
      - name: Commit vendored assets back to the branch
        run: |
          if [[ -n "$(git status --porcelain public/assets)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/assets
            git commit -m "Vendor campaign assets [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
